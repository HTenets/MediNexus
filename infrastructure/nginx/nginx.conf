user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Docker's embedded DNS. Using a resolver + variables in proxy_pass forces
    # nginx to re-resolve the upstream hostname per request instead of caching
    # the container IP at startup — so recreating backend/frontend no longer
    # causes 502s and never needs an nginx restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # ── 子路径部署：应用只挂在 /programs/medinexus 下 ────────────────────
        # 无尾斜杠的子路径也要透传给前端（Next.js 直接返回 200；
        # 带尾斜杠的请求 Next.js 会 308 到这里，故此处不能 301 否则死循环）
        location = /programs/medinexus {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # 前端页面 / 静态资源：完整路径透传（前端已配置 basePath）
        location /programs/medinexus/ {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # 后端 REST API：去掉 /programs/medinexus 前缀后转发到 backend
        location /programs/medinexus/api/ {
            rewrite ^/programs/medinexus/(.*)$ /$1 break;
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 后端 WebSocket：去掉前缀后转发（长连接）
        location /programs/medinexus/ws/ {
            rewrite ^/programs/medinexus/(.*)$ /$1 break;
            set $backend_ws http://backend:8000;
            proxy_pass $backend_ws$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 健康检查
        location /programs/medinexus/health {
            set $backend_health http://backend:8000;
            proxy_pass $backend_health/health;
            access_log off;
        }

        # 子路径专用：根路径及其它路径不再提供服务
        location / {
            return 404;
        }
    }
}
