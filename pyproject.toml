[project]
name = "medinexus"
version = "0.1.0"
description = "MediNexus / 医枢 — 开源多智能体医疗诊断平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "langgraph>=0.3",
    "langchain-core>=0.3",
    "qdrant-client>=1.13",
    # "mem0>=0.1",  # W5: Memory system — install separately when needed
    "celery>=5.4",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["agents*", "app*", "orchestration*", "guardrails*", "knowledge*", "llm*", "memory*", "workers*"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.coverage.run]
source = ["backend"]
