# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  # ── Backend API ───────────────────────────────────────────────────────── #
  - type: web
    name: medinexus-api
    env: docker
    dockerfilePath: infrastructure/docker/Dockerfile.render
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MEDINEXUS_DATABASE_URL
        fromDatabase:
          name: medinexus-db
          property: connectionString
      - key: MEDINEXUS_REDIS_URL
        fromService:
          type: redis
          name: medinexus-redis
          property: connectionString
      - key: MEDINEXUS_QDRANT_URL
        value: ""
      - key: MEDINEXUS_JWT_SECRET
        generateValue: true
      - key: MEDINEXUS_LLM_PROVIDER
        value: ollama
      - key: MEDINEXUS_OLLAMA_BASE_URL
        value: ""
      - key: PYTHONPATH
        value: /app/backend
      - key: DEMO_MODE
        value: "true"

  # ── Redis ─────────────────────────────────────────────────────────────── #
  - type: redis
    name: medinexus-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # ── PostgreSQL ────────────────────────────────────────────────────────── #
  - name: medinexus-db
    plan: free
    databaseName: medinexus
    user: medinexus
    ipAllowList: []
