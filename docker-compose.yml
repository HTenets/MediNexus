services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medinexus}
      POSTGRES_USER: ${POSTGRES_USER:-medinexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medinexus_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medinexus"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    environment:
      MEDINEXUS_DATABASE_URL: ${MEDINEXUS_DATABASE_URL:-postgresql+asyncpg://medinexus:medinexus_dev@postgres:5432/medinexus}
      MEDINEXUS_REDIS_URL: ${MEDINEXUS_REDIS_URL:-redis://redis:6379/0}
      MEDINEXUS_QDRANT_URL: ${MEDINEXUS_QDRANT_URL:-http://qdrant:6333}
      MEDINEXUS_JWT_SECRET: ${MEDINEXUS_JWT_SECRET:-dev-secret-change-in-production}
      MEDINEXUS_DEMO_MODE: ${MEDINEXUS_DEMO_MODE:-true}
      MEDINEXUS_ALLOWED_ORIGINS: ${MEDINEXUS_ALLOWED_ORIGINS:-*}
      MEDINEXUS_LLM_PROVIDER: ${MEDINEXUS_LLM_PROVIDER:-ollama}
      MEDINEXUS_LLM_API_KEY: ${MEDINEXUS_LLM_API_KEY:-}
      MEDINEXUS_LLM_MODEL: ${MEDINEXUS_LLM_MODEL:-}
      MEDINEXUS_LLM_BASE_URL: ${MEDINEXUS_LLM_BASE_URL:-}
      MEDINEXUS_OLLAMA_BASE_URL: ${MEDINEXUS_OLLAMA_BASE_URL:-http://localhost:11434}
      MEDINEXUS_OLLAMA_MODEL: ${MEDINEXUS_OLLAMA_MODEL:-qwen2.5:14b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      MEDINEXUS_DATABASE_URL: ${MEDINEXUS_DATABASE_URL:-postgresql+asyncpg://medinexus:medinexus_dev@postgres:5432/medinexus}
      MEDINEXUS_REDIS_URL: ${MEDINEXUS_REDIS_URL:-redis://redis:6379/0}
      MEDINEXUS_QDRANT_URL: ${MEDINEXUS_QDRANT_URL:-http://qdrant:6333}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        # 子路径部署前缀（默认 /programs/medinexus，可通过环境变量覆盖）
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/programs/medinexus}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: infrastructure/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data: