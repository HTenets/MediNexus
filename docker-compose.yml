services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: medinexus
      POSTGRES_USER: medinexus
      POSTGRES_PASSWORD: medinexus_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medinexus"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      MEDINEXUS_DATABASE_URL: postgresql+asyncpg://medinexus:medinexus_dev@postgres:5432/medinexus
      MEDINEXUS_REDIS_URL: redis://redis:6379/0
      MEDINEXUS_QDRANT_URL: http://qdrant:6333
      MEDINEXUS_JWT_SECRET: dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  pgdata:
  qdrant_data:
