services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medinexus}
      POSTGRES_USER: ${POSTGRES_USER:-medinexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medinexus_prod}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medinexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /opt/program/medinexus_deploy/data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - medinexus-network
    # 低配(2核2G)适配：硬上限512M，允许256M swap兜底
    mem_limit: 512m
    memswap_limit: 768m
    mem_reservation: 128M

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /opt/program/medinexus_deploy/data/redis:/data
    restart: unless-stopped
    networks:
      - medinexus-network
    mem_limit: 128m
    memswap_limit: 256m
    mem_reservation: 32M

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - /opt/program/medinexus_deploy/data/qdrant:/qdrant/storage
    restart: unless-stopped
    networks:
      - medinexus-network
    mem_limit: 512m
    memswap_limit: 768m
    mem_reservation: 128M

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    # Load all backend env vars (incl. the LLM API key) directly from the
    # file. Resolved relative to THIS compose file's directory, so no
    # `--env-file` flag is needed on the command line.
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - medinexus-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    memswap_limit: 768m
    mem_reservation: 128M

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      MEDINEXUS_DATABASE_URL: ${MEDINEXUS_DATABASE_URL:-postgresql+asyncpg://medinexus:medinexus_prod@postgres:5432/medinexus}
      MEDINEXUS_REDIS_URL: ${MEDINEXUS_REDIS_URL:-redis://redis:6379/0}
      MEDINEXUS_QDRANT_URL: ${MEDINEXUS_QDRANT_URL:-http://qdrant:6333}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - medinexus-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 384m
    memswap_limit: 512m
    mem_reservation: 96M

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        # 子路径部署前缀（默认 /programs/medinexus，可通过 .env 覆盖）
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/programs/medinexus}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://47.80.10.180}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - medinexus-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    memswap_limit: 1024m
    mem_reservation: 128M

  nginx:
    build:
      context: ../../infrastructure/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - medinexus-network
    volumes:
      - /opt/program/medinexus_deploy/logs/nginx:/var/log/nginx
      - /opt/program/medinexus_deploy/ssl:/etc/nginx/ssl:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    memswap_limit: 256m

networks:
  medinexus-network:
    driver: bridge
