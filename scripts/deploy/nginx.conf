user nginx;
# ─────────────────────────────────────────────────────────────────────────
# 可选 HTTPS 模板（非默认部署配置）
#
# 默认部署使用 infrastructure/nginx/nginx.conf（HTTP 版），由
# docker-compose.prod.yml 的 nginx 服务（build context ../../infrastructure/nginx）
# 直接构建，本文件不参与构建、也不会被 deploy.sh 覆盖过去。
#
# 仅当服务器已配置 SSL 证书（/etc/nginx/ssl/ 挂载 cert.pem/key.pem）并需要
# 强制 HTTPS 时，手动用本文件替换 infrastructure/nginx/nginx.conf 后重建。
# 修改转发逻辑时务必同步两份文件，避免配置漂移。
# ─────────────────────────────────────────────────────────────────────────
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 用 $request_method $uri 替代 $request：$request 包含完整 query string，
    # 会把 WebSocket 握手时附带的 JWT token 写入 access log 落盘。
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 100m;

    # Docker's embedded DNS. Required for variable-based proxy_pass: nginx
    # re-resolves upstream hostnames (backend/frontend) per request so that
    # recreating containers never leaves stale IPs causing 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Redirect all HTTP traffic to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # SSL configuration — mount cert files via docker-compose volumes
        # Example paths assume certs are mounted at /etc/nginx/ssl/
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── 子路径部署：应用只挂在 /programs/medinexus 下 ────────────────────
        # 无尾斜杠的子路径也要透传给前端（Next.js 直接返回 200；
        # 带尾斜杠的请求 Next.js 会 308 到这里，故此处不能 301 否则死循环）
        location = /programs/medinexus {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # 前端页面：完整路径透传（前端已配置 basePath）
        location /programs/medinexus/ {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # 后端 REST API：去掉 /programs/medinexus 前缀后转发到 backend
        # 注意：set 必须放在 rewrite 之前。rewrite ... break 会终止 rewrite
        # 模块后续指令执行，set 在 rewrite 之后不会生效，导致 proxy_pass 变量为空。
        location /programs/medinexus/api/ {
            set $backend_upstream http://backend:8000;
            rewrite ^/programs/medinexus/(.*)$ /$1 break;
            proxy_pass $backend_upstream$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # 后端 WebSocket：去掉前缀后转发（长连接）
        # 注意：set 必须放在 rewrite 之前（原因同上）。
        location /programs/medinexus/ws/ {
            set $backend_ws http://backend:8000;
            rewrite ^/programs/medinexus/(.*)$ /$1 break;
            proxy_pass $backend_ws$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 健康检查
        location /programs/medinexus/health {
            set $backend_health http://backend:8000;
            proxy_pass $backend_health/health;
            access_log off;
        }

        # 前端静态资源（子路径下）长缓存
        location ~* ^/programs/medinexus/_next/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            set $frontend_static http://frontend:3000;
            proxy_pass $frontend_static;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 子路径专用：根路径及其它路径不再提供服务
        location / {
            return 404;
        }
    }
}
