<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediNexus - 设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{medical:{primary:'#2563EB','primary-hover':'#1D4ED8','primary-light':'#EFF4FF','primary-subtle':'#DBEAFE',accent:'#10B981','accent-light':'#D1FAE5',warning:'#F59E0B','warning-light':'#FEF3C7',danger:'#DC2626','danger-light':'#FEE2E2',bg:'#F8FAFF',sidebar:'#EFF4FF',card:'#FFFFFF',elevated:'#F0F5FF','text-primary':'#1E293B','text-secondary':'#475569','text-muted':'#94A3B8',border:'#E2E8F0','border-light':'#F1F5F9'}},fontFamily:{heading:['Plus Jakarta Sans','sans-serif'],sans:['Inter','system-ui','sans-serif']},boxShadow:{'medical-sm':'0 1px 2px rgba(0,0,0,0.04)','medical-md':'0 4px 12px rgba(0,0,0,0.06)','medical-lg':'0 8px 24px rgba(0,0,0,0.08)','medical-primary':'0 4px 16px rgba(37,99,235,0.15)'}}}}</script>
    <style>body{font-family:'Inter',system-ui,sans-serif}.font-heading{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="bg-medical-bg min-h-screen">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-60 bg-medical-sidebar border-r border-medical-border flex flex-col flex-shrink-0">
            <div class="p-5 flex items-center gap-3">
                <div class="w-8 h-8 bg-medical-primary rounded-lg flex items-center justify-center text-white font-bold text-sm">M</div>
                <div>
                    <div class="font-semibold text-medical-text-primary">MediNexus</div>
                    <div class="text-xs text-medical-text-muted">AI助手在线</div>
                </div>
            </div>
            <nav class="px-3 py-2 flex-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-medical-text-secondary hover:bg-white/60 transition-all text-sm mb-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    控制台
                </a>
                <a href="triage.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-medical-text-secondary hover:bg-white/60 transition-all text-sm mb-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                    AI 问诊
                </a>
                <a href="records.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-medical-text-secondary hover:bg-white/60 transition-all text-sm mb-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
                    健康记录
                </a>
                <a href="profile.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-medical-primary text-white font-medium shadow-medical-sm text-sm mb-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    个人设置
                </a>
            </nav>
            <div class="p-3 border-t border-medical-border">
                <button class="w-full bg-medical-primary text-white py-3 rounded-xl font-medium text-sm flex items-center justify-center gap-2 hover:bg-medical-primary-hover transition-all shadow-medical-primary">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                    开始新分析
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto">
            <header class="h-16 bg-medical-bg/80 backdrop-blur-md border-b border-medical-border flex items-center justify-between px-6 sticky top-0 z-50">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-medical-primary rounded-full animate-pulse"></div>
                    <span class="text-sm font-medium text-medical-primary">系统设置</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full flex items-center justify-center text-medical-text-secondary hover:bg-medical-sidebar cursor-pointer relative">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-medical-danger rounded-full"></span>
                    </div>
                    <div class="w-9 h-9 rounded-full bg-gradient-to-br from-medical-primary to-purple-500 flex items-center justify-center text-white text-xs font-semibold border-2 border-white shadow-medical-sm">DS</div>
                </div>
            </header>

            <div class="p-8 w-full">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 rounded-xl bg-medical-primary-light flex items-center justify-center">
                        <svg class="w-5 h-5 text-medical-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.212 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/><path d="M15 14a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </div>
                    <h1 class="font-heading text-3xl font-bold text-medical-text-primary">设置</h1>
                </div>
                <p class="text-medical-text-secondary mb-6">管理您的账户偏好和系统配置。</p>

                <!-- Settings Layout -->
                <div class="flex gap-6">
                    <!-- Settings Nav -->
                    <div class="w-64 flex-shrink-0 hidden lg:block">
                        <div class="bg-white rounded-2xl shadow-medical-sm border border-medical-border p-2 space-y-1">
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-medical-primary-light text-medical-primary text-sm font-medium">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
                                账户信息
                            </a>
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-medical-text-secondary hover:bg-gray-50 text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>
                                通知偏好
                            </a>
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-medical-text-secondary hover:bg-gray-50 text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.485 3 12 3m0 18h.008M12 12.75h.008"/></svg>
                                语言与地区
                            </a>
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-medical-text-secondary hover:bg-gray-50 text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M9 12.75L11.25 15 15 9.75m5.25 1.5a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                隐私与安全
                            </a>
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-medical-text-secondary hover:bg-gray-50 text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M20.25 6.375c0 2.278-3.714 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.714-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.714 4.125-8.25 4.125S3.75 19.653 3.75 17.625V6.375m16.5 0v-.75a.75.75 0 00-.75-.75h-1.5a.75.75 0 00-.75.75v.75"/></svg>
                                数据管理
                            </a>
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-medical-text-secondary hover:bg-gray-50 text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M9 17.25v1.007a3 3 0 01-.879 2.122l-1.022 1.023a3 3 0 00-2.121.879M16.5 17.25v1.007a3 3 0 00.879 2.122l1.022 1.023a3 3 0 012.121.879M12 17.25v-9.75m0 0L8.25 11.25m3.75-3.75L12 7.5m0-6.75V4.5m0 0L8.25 8.25m3.75-3.75L12 4.5"/></svg>
                                设备管理
                            </a>
                            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-medical-text-secondary hover:bg-gray-50 text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M11.25 11.25l.041-.02a.75.75 0 011.06.056l.053.053a.75.75 0 01.053 1.06l-.041.042a.75.75 0 01-1.06.053l-.053-.053a.75.75 0 01-.053-1.06l.053-.053zM11 14.25a.75.75 0 011.5 0v3a.75.75 0 01-1.5 0v-3zM18 12a6 6 0 01-7.743 5.743L10.5 18.75a.75.75 0 01-1.06 0l-2.25-2.25a.75.75 0 010-1.06l5.243-5.244A6 6 0 0118 12z"/></svg>
                                关于系统
                            </a>
                        </div>
                    </div>

                    <!-- Settings Content -->
                    <div class="flex-1 bg-white rounded-2xl shadow-medical-sm border border-medical-border p-8">
                        <div class="mb-6">
                            <h2 class="text-xl font-semibold text-medical-text-primary">账户信息</h2>
                            <p class="text-sm text-medical-text-muted mt-1">管理您的个人资料和登录方式。</p>
                        </div>

                        <!-- Avatar -->
                        <div class="flex items-center gap-4 mb-8">
                            <div class="w-20 h-20 rounded-2xl bg-gray-200 flex items-center justify-center text-gray-400 text-sm">img</div>
                            <div class="flex flex-col gap-2">
                                <button class="border border-medical-border rounded-xl px-4 py-2 text-sm text-medical-text-secondary flex items-center gap-2 hover:bg-gray-50 transition-colors w-fit">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l3.75 4.5M12 3v10.5"/></svg>
                                    上传新头像
                                </button>
                                <button class="text-sm text-medical-danger flex items-center gap-2 w-fit">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.166L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a1 1 0 00-1-1H5.736a1 1 0 00-1 1v12.5a1 1 0 001 1h12.528a1 1 0 001-1V5.79z"/></svg>
                                    删除头像
                                </button>
                            </div>
                        </div>

                        <!-- Form -->
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div>
                                <label class="block text-sm font-medium text-medical-text-primary mb-1.5">姓名</label>
                                <input type="text" value="Dr. Lin" class="w-full rounded-xl border border-medical-border px-4 py-3 text-sm focus:ring-2 focus:ring-medical-primary focus:border-medical-primary outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-medical-text-primary mb-1.5">邮箱</label>
                                <input type="email" value="lin@stanford.edu" class="w-full rounded-xl border border-medical-border px-4 py-3 text-sm focus:ring-2 focus:ring-medical-primary focus:border-medical-primary outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-medical-text-primary mb-1.5">手机号</label>
                                <input type="tel" value="+86 138****8888" class="w-full rounded-xl border border-medical-border px-4 py-3 text-sm focus:ring-2 focus:ring-medical-primary focus:border-medical-primary outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-medical-text-primary mb-1.5">所属机构</label>
                                <input type="text" value="Stanford Med" class="w-full rounded-xl border border-medical-border px-4 py-3 text-sm focus:ring-2 focus:ring-medical-primary focus:border-medical-primary outline-none transition-all">
                            </div>
                        </div>

                        <div class="h-px bg-gray-100 my-6"></div>

                        <!-- Password -->
                        <div class="mb-6">
                            <h3 class="text-base font-semibold mb-4">修改密码</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-medical-text-primary mb-1.5">当前密码</label>
                                    <input type="password" placeholder="请输入当前密码" class="w-full rounded-xl border border-medical-border px-4 py-3 text-sm focus:ring-2 focus:ring-medical-primary focus:border-medical-primary outline-none transition-all">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-medical-text-primary mb-1.5">新密码</label>
                                    <input type="password" placeholder="至少8位" class="w-full rounded-xl border border-medical-border px-4 py-3 text-sm focus:ring-2 focus:ring-medical-primary focus:border-medical-primary outline-none transition-all">
                                </div>
                                <div class="col-span-2">
                                    <label class="block text-sm font-medium text-medical-text-primary mb-1.5">确认新密码</label>
                                    <input type="password" placeholder="再次输入新密码" class="w-full rounded-xl border border-medical-border px-4 py-3 text-sm focus:ring-2 focus:ring-medical-primary focus:border-medical-primary outline-none transition-all">
                                </div>
                            </div>
                        </div>

                        <button class="bg-medical-primary text-white rounded-xl px-8 py-3 text-sm font-medium shadow-medical-primary hover:bg-medical-primary-hover transition-all mt-4">
                            保存更改
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
